<!DOCTYPE html>
<html>
<head>
    <title>Week 6 Test</title>
</head>

<body>

    <h2>Week 6 HTTP Methods</h2>

    <button onclick="sendData()">Send JSON - POST</button>

    <button onclick="deleteUser()">Delete User</button>

    <p id="result"></p>

    <script>

        async function sendData() {

            const response = await fetch("/users", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name: "Lahari",
                    age: 20,
                    course: "FSD"
                })
            });

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data);
        }


        async function deleteUser() {

            const response = await fetch("/users/101", {
                method: "DELETE"
            });

            const data = await response.json();

            document.getElementById("result").innerText =
                JSON.stringify(data);
        }

    </script>

</body>
</html>
